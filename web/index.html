<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>落地灯</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="/launch-1206x2622-v1.png" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="落地灯">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="/style.css">
<script defer src="/app.js"></script>
</head>
<body class="rf-unavailable">
<main>
<header><div><p class="eyebrow">LAMP / RF BRIDGE</p><h1>落地灯</h1></div><span id="connection" class="badge">连接中</span></header>
<section id="login-panel" class="login-panel" aria-labelledby="login-title" hidden>
<h2 id="login-title">登录落地灯</h2><p class="muted">使用设备访问密码。</p>
<form id="login-form" action="/api/session/login" method="post" autocomplete="on">
<label for="login-username">账号</label><input id="login-username" name="username" type="text" value="admin" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="32" required>
<label for="login-password">密码</label><input id="login-password" type="password" autocomplete="current-password" maxlength="128" required>
<label class="remember"><input id="login-remember" type="checkbox" checked><span>信任此设备，下次直接打开</span></label>
<button id="login-submit" class="save" type="submit">登录</button>
</form><p id="login-result" class="login-result" role="status" aria-live="polite"></p>
</section>
<section class="power-card" aria-label="电源控制" data-power-effect="neutral">
<div class="lamp" aria-hidden="true"><svg viewBox="0 0 96 104">
<g class="lamp-base"><path d="M48 36v56m-15 3h30" stroke="#857d70" stroke-width="2.5" stroke-linecap="round"/><path d="M29 8h38l12 29H17z" fill="#746d60"/><ellipse cx="48" cy="38" rx="31" ry="3" fill="#8c8271"/></g>
<g class="lamp-light"><ellipse cx="48" cy="97" rx="27" ry="3" fill="#bda17c" opacity=".2"/><path d="M29 8h38l12 29H17z" fill="#efd4ae"/><ellipse cx="48" cy="38" rx="31" ry="3" fill="#fae6c9"/><path d="M24 42h48l17 45H7z" fill="#e9c596" opacity=".08"/></g>
</svg></div>
<button id="power" data-command="power" class="power-button" aria-label="切换开关" aria-describedby="effect-description" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m-5.5-6.1a8 8 0 1 0 11 0"/></svg></button>
<span id="effect-description" class="sr-only">灯图标仅表示本次网页操作示意，不是灯具回传状态。</span>
</section>
<section class="controls" aria-label="灯光控制">
<button data-command="brightness_down" class="control" disabled><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 15.5a5 5 0 0 1-1-3c0-3 2.5-5.5 5.5-5.5 1.3 0 2.5.5 3.5 1.3M7.5 17h7m-6 3h5M2 12.5H1M11 3V2M4 5.5 3 4.5m14.5 7h5"/></svg></span><span class="control-copy"><strong>调暗</strong><small>降低亮度</small></span></button>
<button data-command="brightness_up" class="control" disabled><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="10" r="3.5"/><path d="M9 2V1m0 18v-1M1 10H0m18 0h-1M3 4 2 3m14 14-1-1M3 16l-1 1M15 4l1-1m3 9v8m-4-4h8"/></svg></span><span class="control-copy"><strong>调亮</strong><small>增加亮度</small></span></button>
<button data-command="cct_down" class="control" disabled><span class="control-icon"><i class="temperature warm" aria-hidden="true"></i></span><span class="control-copy"><strong>偏暖</strong><small>暖黄灯光</small></span></button>
<button data-command="cct_up" class="control" disabled><span class="control-icon"><i class="temperature cool" aria-hidden="true"></i></span><span class="control-copy"><strong>偏冷</strong><small>冷白灯光</small></span></button>
<button data-command="night_mode" class="control" disabled><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.1A8.6 8.6 0 0 1 9.9 3.5a8.6 8.6 0 1 0 10.6 10.6Z"/></svg></span><span class="control-copy"><strong>夜灯</strong><small>柔和微光</small></span></button>
<button data-command="timer_10min" class="control" disabled><span class="control-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 2h6m-3 0v3m6 1 1.5-1.5"/></svg></span><span class="control-copy"><strong>定时</strong><small>10 分钟</small></span></button>
</section>
<p id="notice" class="notice" role="status" aria-live="polite">正在连接网关…</p>
<section id="wifi-setup" class="setup" hidden>
<h2>连接家庭 Wi-Fi</h2><p class="muted">选择 2.4 GHz 网络。连接信息仅保存在设备中。</p>
<form id="wifi-form">
<label for="ssid">Wi-Fi 名称</label><input id="ssid" name="ssid" autocomplete="off" maxlength="32" required>
<label for="password">Wi-Fi 密码</label><input id="password" name="password" type="password" autocomplete="new-password" maxlength="63">
<button id="wifi-save" class="save" type="submit">保存并连接</button>
</form>
<p id="wifi-result" class="muted" role="status"></p><a id="home-link" hidden></a>
</section>
<footer><div class="device-info"><span id="radio-state">等待设备状态</span><span id="network-state"></span></div><button id="trust-device" class="trust-button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5c0 4.2 3 7.8 7.5 10 4.5-2.2 7.5-5.8 7.5-10V6Z"/><path d="m8.5 11.5 2.3 2.3 4.7-4.7"/></svg><span id="trust-label">信任此设备</span></button></footer>
</main>
</body>
</html>
