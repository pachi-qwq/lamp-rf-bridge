; Default Web bridge; keep earlier environments for diagnosis.
; 默认 Web 网关；保留 esp32dev / phase2 / phase3 为各阶段诊断环境。
[platformio]
default_envs = phase4
core_dir = .pio-core

[env:esp32dev]
build_src_filter = +<main.cpp> +<cc1101_spi.cpp>
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
    platformio/tool-scons@4.40801.0
    platformio/tool-openocd-esp32@2.1100.20220706
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
monitor_encoding = UTF-8
monitor_dtr = 0
monitor_rts = 0
build_unflags = -std=gnu++11
build_src_flags = -Werror
build_flags =
    -std=gnu++17
    -Wall
    -Wextra

[env:phase2]
extends = env:esp32dev
build_src_filter = +<phase2_main.cpp> +<cc1101_spi.cpp> +<pulse_capture.cpp>

[env:phase3]
extends = env:esp32dev
build_src_filter = +<phase3_main.cpp> +<cc1101_spi.cpp> +<rf_replay.cpp>

[env:phase4]
extends = env:esp32dev
build_src_filter = +<phase4_main.cpp> +<cc1101_spi.cpp> +<rf_replay.cpp> +<lamp_controller.cpp> +<network_app.cpp>
upload_speed = 460800
